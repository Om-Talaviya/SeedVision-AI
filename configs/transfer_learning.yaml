# Inherits defaults from default.yaml with Transfer Learning parameters
model:
  architecture: "mobilenet_v2"
  name: "MobileNetV2-Transfer"
  pretrained: true
  num_classes: 4
  freeze_backbone: false # Fine-tune head + top inverted residual blocks
  unfreeze_layers: 4
  dropout_rate: 0.3
  target_layer: "features.18" # Final 1x1 conv layer before global pooling for Grad-CAM

training:
  epochs: 25
  batch_size: 16
  learning_rate: 0.0003 # Lower learning rate for fine-tuning
  optimizer: "adamw"
  weight_decay: 0.001
  scheduler: "cosine"
  min_lr: 0.000005
  early_stopping_patience: 6
